[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-specialist-lab"
version = "0.2.0"
description = "Six-module reverse-distillation, training, agent and context-virtualization stack for a small Python/DSA coding model"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "transformers>=4.45", "datasets>=2.20", "accelerate>=0.33", "peft>=0.12",
  "sentencepiece>=0.2", "pytest>=8.0", "numpy>=1.26", "pandas>=2.2", "tqdm>=4.66", "jsonlines>=4.0", "pyyaml>=6.0"
]

[project.optional-dependencies]
train = ["trl>=0.12"]
proxy = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "chromadb>=0.5"]
serve = ["vllm>=0.6"]
wandb = ["wandb>=0.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
