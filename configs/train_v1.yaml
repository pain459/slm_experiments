base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
revision: main
train_file: data/train_v1/train.jsonl
validation_file: data/train_v1/validation.jsonl
output_dir: experiments/python_v1
seed: 42
max_length: 2048
learning_rate: 0.0001
num_train_epochs: 1.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
logging_steps: 10
save_steps: 200
eval_steps: 200
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
fp16: false
gradient_checkpointing: true
load_in_4bit: true
lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
